name: Build iOS

# UNTESTED — written without access to a Mac. The overall shape (checkout,
# npm ci, cap sync, archive, export) is the standard pattern, but exact
# Xcode/runner versions and flag names may need adjusting on the first real
# run. Treat the first push that triggers this as a debugging session, not
# a guaranteed-green build.
#
# Requires an Apple Developer Program membership and three GitHub secrets,
# generated from App Store Connect → Users and Access → Integrations → Keys
# (create an "App Manager" key):
#   ASC_API_KEY_ID       - the key's 10-character ID
#   ASC_API_ISSUER_ID    - the issuer ID shown on the same page
#   ASC_API_PRIVATE_KEY  - the full contents of the downloaded AuthKey_*.p8 file
#
# Also requires ios/App/ExportOptions.plist's teamID to be filled in with
# the real Apple Developer Team ID (see Membership details after enrolling).

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (generate native config + Swift Package deps)
        run: npx cap sync ios

      - name: Import App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

      - name: Archive (automatic signing via App Store Connect API key)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            archive

      - name: Export IPA
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wingpact-ios-release
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
