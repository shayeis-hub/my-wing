name: Build iOS

# UNTESTED — written without access to a Mac. The overall shape (checkout,
# npm ci, cap sync, archive, export) is the standard pattern, but exact
# Xcode/runner versions and flag names may need adjusting on the first real
# run. Treat the first push that triggers this as a debugging session, not
# a guaranteed-green build.
#
# Requires an Apple Developer Program membership and five GitHub secrets:
#   ASC_API_KEY_ID              - App Store Connect API key ID (Admin role;
#                                  App Manager cannot manage certs/profiles)
#   ASC_API_ISSUER_ID           - the issuer ID shown on the same page
#   ASC_API_PRIVATE_KEY         - contents of the downloaded AuthKey_*.p8 file
#   IOS_DIST_CERTIFICATE_P12    - base64 of a .p12 bundling the Apple
#                                  Distribution certificate + matching
#                                  private key (must be generated together —
#                                  Apple never returns a private key for a
#                                  certificate created from an externally-
#                                  generated CSR, so -allowProvisioningUpdates
#                                  alone cannot sign with it on a fresh runner).
#                                  IMPORTANT: export it with OpenSSL's -legacy
#                                  flag. OpenSSL 3.x defaults to AES-256 +
#                                  SHA-256 MAC, which macOS's `security import`
#                                  cannot read — it fails with the misleading
#                                  "MAC verification failed (wrong password?)"
#                                  even when the password is correct. -legacy
#                                  produces the RC2-40/3DES + SHA-1 MAC format
#                                  the keychain expects.
#   IOS_DIST_CERTIFICATE_PASSWORD - the password the .p12 was exported with
#
# CODE_SIGN_STYLE is Manual (see project.pbxproj) with
# PROVISIONING_PROFILE_SPECIFIER pointing at the "Wingpact App Store" profile
# created in the Developer Portal — Xcode's automatic signing repeatedly
# proved unreliable here, so both the certificate and profile are pinned
# explicitly rather than left for -allowProvisioningUpdates to resolve.
#
# Also requires ios/App/ExportOptions.plist's teamID to be filled in with
# the real Apple Developer Team ID (see Membership details after enrolling).

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync (generate native config + Swift Package deps)
        run: npx cap sync ios

      - name: Import App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

      - name: Import signing certificate into keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          P12_PASSWORD=$(printf '%s' "$P12_PASSWORD" | tr -d '[:space:]')
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Resolve version numbers
        run: |
          # Marketing version tracks the web app's package.json, exactly like
          # android/app/build.gradle does, so the three stay in lockstep.
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # App Store Connect rejects a build whose number it has seen before,
          # so the build number must strictly increase across uploads.
          # github.run_number is monotonic per workflow and never reused.
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Building $APP_VERSION (${{ github.run_number }})"

      - name: Archive (manual signing, pinned certificate + profile)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export IPA
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wingpact-ios-release
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      # Sends the build to App Store Connect, where it appears under TestFlight
      # after Apple finishes processing it (usually a few minutes). This is the
      # only route to Apple from this setup — the manual alternative, the
      # Transporter app, is macOS-only. altool finds the signing key by name in
      # ~/private_keys, which the earlier step already wrote.
      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Uploading $(basename "$IPA") — version $APP_VERSION build $BUILD_NUMBER"
          xcrun altool --upload-app \
            --file "$IPA" \
            --type ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
