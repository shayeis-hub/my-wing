name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix SSL trust store for Temurin JDK on Linux
        run: |
          export JAVA_TRUSTSTORE=$JAVA_HOME/lib/security/cacerts
          echo "org.gradle.jvmargs=-Djavax.net.ssl.trustStore=$JAVA_TRUSTSTORE -Djavax.net.ssl.trustStorePassword=changeit" >> ~/.gradle/gradle.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Remove old reserved-keyword package dir
        run: rm -rf android/app/src/main/java/app/wingpact/native

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mabne-kanaf-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
